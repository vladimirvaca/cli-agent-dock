# CI for pushes to 'main' and pull requests, in two parallel jobs:
# - build: build the plugin ZIP ('buildPlugin') and run tests and static checks ('check').
# - verify: IntelliJ Plugin Verifier ('verifyPlugin') against the recommended IDE set.
#
# Why two jobs: verifyPlugin downloads one full IDE per supported major version (five
# today), roughly 18 GB downloaded plus unpacked. GitHub caps a repository's Actions cache
# at 10 GB, so caching those IDEs evicted the build's own cache on every run and both jobs
# started cold. The verify job therefore runs with the Gradle cache disabled (fetching the
# IDEs from JetBrains' CDN is faster than that cache thrash), which keeps the build job's
# cache small enough to actually be reused.
#
# verify skips pull requests: it catches IntelliJ API removals, which change when JetBrains
# ships an IDE, not with a PR. It runs on pushes to main, weekly, and on demand
# (Actions > Build > Run workflow, which can target a PR branch too).
#
# Releases are handled separately by release.yml, triggered by pushing a 'v*' tag.
# See RELEASING.md for the release procedure.

name: Build
on:
  # Trigger the workflow on pushes to only the 'main' branch (this avoids duplicate checks being run e.g., for dependabot pull requests)
  push:
    branches: [ main ]
  # Trigger the workflow on any pull request
  pull_request:
  # Weekly verifier run, so a newly released IDE is checked even without commits.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:

      - name: Fetch Sources
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # One invocation for both so configuration, daemon, and caches are paid once.
      - name: Build and check
        run: ./gradlew buildPlugin check

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: plugin-distribution
          path: build/distributions/*.zip

      - name: Collect test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests

  verify:
    name: Plugin Verifier
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:

      - name: Fetch Sources
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      # Cache disabled on purpose: see the note at the top of this file.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Verify plugin
        run: ./gradlew verifyPlugin

      - name: Collect Plugin Verifier reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: pluginVerifier-report
          path: build/reports/pluginVerifier

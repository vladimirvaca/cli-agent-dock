settings.notifyWhenIdle=Notify me when an agent goes quiet
settings.notifyWhenIdle.comment=Posts a notification when an agent stops producing output while you are looking at something else, \
  so an approval prompt waiting in a hidden session doesn't go unnoticed. If you have switched to another application, \
  a system notification is used as well. Never fires while that session's tab is on screen.
